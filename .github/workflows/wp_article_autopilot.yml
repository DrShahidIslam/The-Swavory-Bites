name: Daily WordPress Article & Pinterest Autopilot

on:
  schedule:
    # Runs once daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub UI

permissions:
  contents: write

jobs:
  publish-daily-article:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'pinterest_engine/package-lock.json'

      - name: Install Dependencies
        run: |
          cd pinterest_engine
          npm ci

      - name: Generate 1 Daily AEO/GEO WordPress Article & Publish Pins
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://theswavorybites.com' }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          BRIDGE_PAGE_URL: ${{ secrets.BRIDGE_PAGE_URL || 'https://the-swavory-bites.pages.dev/bridge_page/' }}
          PINTEREST_BOARD_DESSERTS: ${{ secrets.PINTEREST_BOARD_DESSERTS }}
          PINTEREST_BOARD_BAKING: ${{ secrets.PINTEREST_BOARD_BAKING }}
          PINTEREST_BOARD_DRINKS: ${{ secrets.PINTEREST_BOARD_DRINKS }}
          PINTEREST_BOARD_SPREADS_EN: ${{ secrets.PINTEREST_BOARD_SPREADS_EN }}
          PINTEREST_BOARD_FRUIT: ${{ secrets.PINTEREST_BOARD_FRUIT }}
          PINTEREST_BOARD_TRENDS: ${{ secrets.PINTEREST_BOARD_TRENDS }}
          PINTEREST_BOARD_QUICK: ${{ secrets.PINTEREST_BOARD_QUICK }}
          PINTEREST_BOARD_RECIPES_FR: ${{ secrets.PINTEREST_BOARD_RECIPES_FR }}
          PINTEREST_BOARD_SPREADS_FR: ${{ secrets.PINTEREST_BOARD_SPREADS_FR }}
          PINTEREST_BOARD_TRENDS_FR: ${{ secrets.PINTEREST_BOARD_TRENDS_FR }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cd pinterest_engine
          npm run daily-article || true

      - name: Commit & Push Updated Queue State
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -f pinterest_engine/data/state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: publish daily wp article & update queue state [skip ci]" && git push)
