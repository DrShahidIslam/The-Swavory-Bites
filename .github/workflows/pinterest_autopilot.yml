name: Pinterest Autopilot Engine

on:
  schedule:
    # Runs 6 times a day (every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Allows github-actions[bot] to commit & push state.json back to repo

jobs:
  run-autopilot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'pinterest_engine/package-lock.json'

      - name: Install Dependencies
        run: |
          cd pinterest_engine
          npm ci

      - name: Run Pinterest Discovery & API Publish Pipeline
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://el-mordjene.info' }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          BRIDGE_PAGE_URL: ${{ secrets.BRIDGE_PAGE_URL || 'https://the-swavory-bites.pages.dev/bridge_page/' }}
          PINTEREST_BOARD_DESSERTS: ${{ secrets.PINTEREST_BOARD_DESSERTS }}
          PINTEREST_BOARD_BAKING: ${{ secrets.PINTEREST_BOARD_BAKING }}
          PINTEREST_BOARD_DRINKS: ${{ secrets.PINTEREST_BOARD_DRINKS }}
          PINTEREST_BOARD_SPREADS_EN: ${{ secrets.PINTEREST_BOARD_SPREADS_EN }}
          PINTEREST_BOARD_FRUIT: ${{ secrets.PINTEREST_BOARD_FRUIT }}
          PINTEREST_BOARD_TRENDS: ${{ secrets.PINTEREST_BOARD_TRENDS }}
          PINTEREST_BOARD_QUICK: ${{ secrets.PINTEREST_BOARD_QUICK }}
          PINTEREST_BOARD_RECIPES_FR: ${{ secrets.PINTEREST_BOARD_RECIPES_FR }}
          PINTEREST_BOARD_SPREADS_FR: ${{ secrets.PINTEREST_BOARD_SPREADS_FR }}
          PINTEREST_BOARD_TRENDS_FR: ${{ secrets.PINTEREST_BOARD_TRENDS_FR }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          PUBLISH_BATCH_SIZE: '1'
        run: |
          cd pinterest_engine
          npm run discover || true
          npm run backfill || true
          npm run render || true
          npm run publish:api || true

      - name: Commit & Push Updated State
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -f pinterest_engine/data/state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update pinterest queue state [skip ci]" && git push)
